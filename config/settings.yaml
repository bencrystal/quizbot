# quizbot settings. Any key can be overridden by env var QUIZBOT_<KEY> (see .env.example) or CLI flags.

channel_name: "Play It By Ear"

# Game -----------------------------------------------------------------------
# ladder = sound → type (+colour) → region → Pokédex + silhouette morph → reveal, 4/3/2/1 pts
format: long                    # long (16:9, 10 rounds) | short (9:16, 1 round). Scheduler passes --format.
mechanic: ladder                # ladder (sound → hint → hint, 3/2/1 pts) | choice (spoken A-D) | cold
rounds_per_episode: 0           # 0 = format default (10 long / 1 short)
stage_seconds: 0                # thinking time per stage; 0 = format default (4 long / 3 short)
fps: 30

# Music ----------------------------------------------------------------------
music_provider: file            # file (Ben's track) | procedural (generated per episode) | elevenlabs | none
music_bed: assets/music/bed.wav # Ben's pokemon_quiz_test_bgm, 122 bpm; 8-bar intro then drums
music_loop_start: 15.74         # seconds: loop body starts here (bar 9), intro plays once before it
music_loop_end: 59.02           # seconds: 22 bars later, on the bar line
music_highpass_hz: 70           # corrective EQ: tame the sub so it doesn't mud up phone speakers
music_lowpass_hz: 11000         # sit behind the voice
music_notch_hz: 15800           # constant whine in the source
music_bed_db: -24               # bed level between lines (track is dense and mastered hot)
music_duck_db: -10              # extra sidechain ducking whenever voice or a quiz sound is playing
music_prompt: "cozy, cheerful, Animal Crossing-style background loop, soft marimba and warm pads, major key, no drums, gentle"
sting: assets/music/sting.wav         # ~0.5s reveal hit
tick: assets/music/tick.wav           # ~0.1s per-second blip during thinking time

# Providers ------------------------------------------------------------------
tts_provider: dev               # dev | kokoro | openai | elevenlabs | piper
tts_voice: ""                   # kokoro: af_heart / am_michael / bf_emma ... ; elevenlabs: voice id
kokoro_url: ""                  # e.g. http://localhost:8880 if you run kokoro-fastapi; empty = in-process
planner: template               # template | claude   (claude = titles, intros, banter, fact rewrites)
claude_model: claude-sonnet-4-5

# Content selection ------------------------------------------------------------
packs_enabled: [pokemon]        # birds paused 2026-10-26 (10× lower reach); re-add to resume
longs_per_pack_per_week: 1
shorts_famous_only: true        # Shorts use the well-known subset (Gen 1-4 + famous later ones)
shorts_cold_open: auto          # auto = alternate per Short (A/B test) | true | false. Cold open = cry before the question line
track_used: short               # formats that never repeat a Pokémon: short | long | all | none. Long-form draws freely.

# Safety rails for unattended runs --------------------------------------------
max_episodes_per_day: 5         # scheduler never renders more than this, whatever happens
rapid_per_day: 1                # rapid-fire Shorts per day (five sounds, no hints; takes the 15:00 UTC slot)
rapid_rounds: 5
rapid_reuse_days: 90            # rapid-fire keeps its own no-repeat list and may reuse an item after this long
tts_speed: 1.05                 # tempo applied to every spoken line after synthesis (pitch kept); A/B-able
tts_speed_long: 1.08            # tempo for long read-outs: the Pokédex/field-guide hint and the fact
max_tts_chars_per_run: 20000    # aborts a run that would blow through a paid TTS tier

# Publishing -----------------------------------------------------------------
upload: false                   # CI sets QUIZBOT_UPLOAD=true
youtube_privacy: public         # private | unlisted | public
publish_time: ""                # "HH:MM" local to schedule; empty = live as soon as the upload finishes
youtube_category_id: "27"       # Education
made_for_kids: false

notify_webhook: ""              # Slack/Discord incoming webhook for one-line run summaries

packs:
  pokemon:
    generations: [1, 2, 3, 4]
    types: [fire, water, grass, electric, psychic, ghost, dragon, bug]
