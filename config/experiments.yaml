# Sequential A/B experiments for Shorts. One is active at a time; variants alternate per Short.
# The nightly analytics job (scripts/analytics_export.py) judges the active experiment once every variant has
# `min_n` videos with retention data, records the winner in state/experiments.json, and activates the next one.
# Winners become the baseline for everything after them. Each variant is a set of settings overrides.
#
# Decision rule (metric = average % viewed, the swipe-away signal; views are a tie-breaker):
#   at n >= min_n per side: winner if the best variant leads by >= min_lead (relative) on % viewed;
#   otherwise keep running until n >= max_n per side, then take the leader on % viewed, views on a tie.
min_n: 4
max_n: 8
min_lead: 0.10

experiments:
  - id: open
    question: "Cold open (sound first) or announce the question first?"
    variants:
      cold:     { shorts_cold_open: "true",  opening_style: question }
      announce: { shorts_cold_open: "false", opening_style: question }
      punch:    { shorts_cold_open: "false", opening_style: punch }      # "Name this Pokémon!" then the cry

  # Viewers leave at ~23 s whatever the length (they answer on the first sound); the reveal lands at ~30 s.
  # snappy = one hint, 2 s thinks → reveal at ~22 s. Is that enough to play along?
  - id: snappy
    question: "Standard Short (two hints, 2.5 s thinks) or snappy (one hint, 2 s; reveal ~22 s)?"
    variants:
      standard: { short_hints: 0, stage_seconds: 2.5, short_replay: "false", short_outro: spoken }
      snappy:   { short_hints: 1, stage_seconds: 2.0, short_replay: "false", short_outro: caption }

  # The one closing ask: score prompt (comments) or subscribe (the slower YPP gate). Judged on % viewed as
  # always; the dashboard rows also show subscribers gained per video so the trade is visible.
  - id: cta
    question: "Close on 'How many points did you get?' or 'New quiz every day. Subscribe!'?"
    variants:
      score:     { short_cta: score }
      subscribe: { short_cta: subscribe }

  # Visual (1 of the 4-per-queue allowance): rounded display font + the spoken word lit as it is said, vs the
  # previous static captions. Shipped as the default pending this read.
  - id: captions
    # parallel since 2026-11-01: the kinetic look shipped as the baseline on 10-30 and the first two days
    # looked soft, so this runs alongside `open` rather than waiting its turn in the queue
    parallel: true
    min_n: 6
    max_n: 12
    question: "Kinetic captions (word lit as spoken, rounded font) or the previous static layout?"
    variants:
      kinetic: { captions: kinetic }
      static:  { captions: static }

  - id: cry
    # parallel since 2026-11-02 ("that's not their sounds", 2026-10-29): the original Game Boy/DS cry or the
    # current one. Gen 6+ has no original, so those Shorts fall out of the sample (exp:cry=fallback).
    parallel: true
    min_n: 8
    max_n: 16
    question: "Original Game Boy/DS cry or the modern one (Gen 1-5)?"
    variants:
      modern: { cry_version: latest }
      og:     { cry_version: legacy }

  - id: rapidbeat
    format: rapid
    min_n: 6
    max_n: 12
    question: "Rapid-fire: one play, or the sound again on the silhouette plus silent type pills while thinking?"
    variants:
      once:  { rapid_replay: "false", rapid_pills: "false" }
      twice: { rapid_replay: "true",  rapid_pills: "true" }

  # Rapid-fire: five or seven sounds (~35 s vs ~45 s). Judged on REACH (7-day views), not % viewed, because
  # % viewed mechanically punishes the longer video; the dashboard still shows avp so a retention collapse is visible.
  - id: rapidlen
    format: rapid
    parallel: true
    metric: views7d
    min_n: 8
    max_n: 14
    question: "Rapid-fire: five sounds (~35 s) or seven (~45 s)? Judged on 7-day views."
    variants:
      five:  { rapid_rounds: 5 }
      seven: { rapid_rounds: 7 }

  # Rapid-fire ending: spoken score ask + pause, or caption-only ending on the reveal so a replay loops cleanly
  - id: rapidtail
    format: rapid
    parallel: true
    min_n: 8
    max_n: 14
    question: "Rapid-fire: spoken 'how many did you get' or a loop-ready caption-only ending?"
    variants:
      spoken: { rapid_tail: spoken }
      loop:   { rapid_tail: loop }

  - id: hints
    question: "Two hints or just the Pokédex/field-guide hint?"
    variants:
      two: { short_hints: 2 }
      one: { short_hints: 1 }

  - id: title
    question: "Question title or challenge title?"
    variants:
      question:  { title_style: question }
      challenge: { title_style: challenge }
      only1:     { title_style: only1 }      # "Only 1% of fans can name…" (corpus study 2026-11-04: claim-of-difficulty titles dominate)

  - id: think
    question: "2.5 s or 2.0 s of thinking time per stage?"
    variants:
      s25: { stage_seconds: 2.5 }
      s20: { stage_seconds: 2.0 }

  - id: pace
    question: "Brisk or quick delivery?"
    variants:
      brisk: { tts_pace: brisk }
      quick: { tts_pace: quick }

  - id: energy
    question: "Host energy or full showman?"
    variants:
      host:    { tts_energy: host }
      showman: { tts_energy: showman }

  # Post-synthesis tempo (pitch kept). gpt-4o-mini-tts ignores the API's speed parameter, so this is the
  # precise speed knob; `pace` above tests delivery via instructions instead.
  - id: tempo
    question: "Current tempo (+7 % on every line) or a touch faster (+12 %)?"
    variants:
      t107: { tts_speed: 1.07, tts_speed_long: 1.07 }
      t112: { tts_speed: 1.12, tts_speed_long: 1.12 }

  # Runs alongside the sequential queue; 4 arms = exactly one ElevenLabs Short per day at 4 Shorts/day.
  # Judged on the same rule but with a higher bar: it costs money, so it must win clearly.
  - id: voice
    parallel: true
    question: "Which voice holds viewers: OpenAI coral / ash / sage, or ElevenLabs Liam?"
    min_n: 6
    max_n: 12
    min_lead: 0.15
    variants:
      coral: { tts_provider: openai, tts_voice: coral }
      ash:   { tts_provider: openai, tts_voice: ash }
      sage:  { tts_provider: openai, tts_voice: sage }
      liam:  { tts_provider: elevenlabs, tts_voice: "name:Liam" }

  # Long-form thumbnails, judged on views in the first 7 full days (the click-through proxy; the API has no
  # CTR). One long video a day → ~3 weeks to a decision. `format: long` experiments have their own queue.
  - id: thumb
    format: long
    metric: views7d
    question: "Long-form thumbnail: silhouettes with a ? or full-colour art?"
    min_n: 5
    max_n: 10
    min_lead: 0.20
    variants:
      sil: { thumb_style: sil }
      art: { thumb_style: art }
