# Monthly (and on demand): re-scrape the Pokémon LP Wiki pronunciation guide and commit it.
name: pronunciation guide
on:
  workflow_dispatch:
  schedule:
    - cron: "0 9 1 * *"
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/fetch_pronunciations.py
      - run: |
          git config user.name "quizbot"
          git config user.email "benjamincrystal8@gmail.com"
          git add assets/pokemon_pronunciations.json
          git diff --cached --quiet || git commit -m "Sync Pokémon pronunciation guide"
          git push
