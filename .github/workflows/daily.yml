# Zero-hardware alternative to launchd. Kokoro runs fine on the CPU runners.
# Secrets: YT_CLIENT_SECRET_JSON (config/client_secret.json), YT_TOKEN_JSON (state/youtube_token.json after a local
# `python -m quizbot auth`), ANTHROPIC_API_KEY if planner: claude, ELEVENLABS_API_KEY/OPENAI_API_KEY if used.
# The used-items DB persists in the Actions cache so Pokémon don't repeat.
name: episodes
on:
  schedule:
    # Hourly; scripts/due.py decides from the ledger whether a Short (slots 11/15/19/23 UTC), the day's long-form
    # (from 12:30 UTC) or nothing is due — GitHub's cron drops and delays firings, so the slots themselves are
    # not trusted. Missed slots catch up on the next hour.
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      format: { default: auto, type: choice, options: [auto, short, long, rapid], description: "auto = whatever the ledger says is due (safe to call any time); rapid = five-sound Short" }
      theme: { default: "" }
      force: { default: false, type: boolean, description: "ignore the daily cap (manual test runs)" }
      pack: { default: "auto", description: "pokemon | birds | auto (rotate)" }
      cold_open: { default: "auto", type: choice, options: [auto, "true", "false"], description: "Shorts: cry before the question line (auto = alternate)" }

concurrency:
  group: quizbot-render
  cancel-in-progress: false
permissions:
  contents: write
  issues: write

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements.txt
      # Kokoro (free local TTS) pulls in torch — ~3 minutes per run. Only install it when it is the provider.
      - if: ${{ vars.QUIZBOT_TTS_PROVIDER == 'kokoro' }}
        run: sudo apt-get install -y espeak-ng && pip install kokoro soundfile
      - name: Refresh pronunciation guide (falls back to the committed copy)
        run: python scripts/fetch_pronunciations.py || echo "::warning::pronunciation guide fetch failed; using committed copy"
      - uses: actions/cache/restore@v4        # saved explicitly at the end, only when something rendered
        with:
          path: |
            state/quizbot.db
            state/cache
            out
          key: quizbot-state-${{ github.run_id }}
          restore-keys: quizbot-state-
      - uses: actions/cache/restore@v4       # token from the last `youtube reauth` run, if any
        with:
          path: state/youtube_token.json
          key: yt-token-
          restore-keys: yt-token-
      - uses: actions/cache/restore@v4       # Meta (Instagram/Facebook) token from `meta auth`, if any
        with:
          path: state/meta_token.json
          key: meta-token-
          restore-keys: meta-token-
      - name: ledger — restore from the `ledger` branch if the cache had nothing
        run: |
          if [ ! -s state/quizbot.db ]; then
            git fetch -q origin ledger 2>/dev/null && git show origin/ledger:quizbot.db > state/quizbot.db && echo "ledger restored from branch" || echo "no ledger yet"
          fi
      - name: secrets → files
        run: |
          mkdir -p state config
          echo '${{ secrets.YT_CLIENT_SECRET_JSON }}' > config/client_secret.json
          [ -s state/youtube_token.json ] || echo '${{ secrets.YT_TOKEN_JSON }}' > state/youtube_token.json
      - name: decide format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.format }}" != "auto" ]; then echo "format=${{ github.event.inputs.format }}" >> $GITHUB_OUTPUT
          else echo "format=$(python scripts/due.py)" >> $GITHUB_OUTPUT; fi
          cat $GITHUB_OUTPUT
      - name: run
        if: steps.fmt.outputs.format != 'none'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XC_API_KEY: ${{ secrets.XC_API_KEY }}
          # OpenAI voice when the key is present, Kokoro (free, local) otherwise
          QUIZBOT_TTS_PROVIDER: ${{ vars.QUIZBOT_TTS_PROVIDER || (secrets.OPENAI_API_KEY && 'openai' || 'kokoro') }}
          QUIZBOT_TTS_VOICE: ${{ vars.QUIZBOT_TTS_VOICE || (secrets.OPENAI_API_KEY && 'coral' || 'am_michael') }}
          QUIZBOT_PLANNER: ${{ vars.QUIZBOT_PLANNER || 'template' }}
          QUIZBOT_UPLOAD: "true"
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}     # stages cross-post media on the public portfolio release
          QUIZBOT_SHORTS_COLD_OPEN: ${{ github.event.inputs.cold_open || 'auto' }}
          TZ: America/New_York
        run: |
          set -o pipefail
          (python -m quizbot retry-uploads || true) 2>&1 | tee -a state/run.log
          FMT=${{ steps.fmt.outputs.format }}; MECH=""
          if [ "$FMT" = "rapid" ]; then FMT=short; MECH="--mechanic rapid"; fi
          python -m quizbot run --format $FMT $MECH --pack ${{ github.event.inputs.pack || 'auto' }} \
            ${{ github.event.inputs.theme && format('--theme {0}', github.event.inputs.theme) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} 2>&1 | tee -a state/run.log
      - uses: actions/cache/save@v4           # hourly 'none' runs save nothing, so the token caches are not churned out
        if: always() && steps.fmt.outputs.format != 'none'
        with:
          path: |
            state/quizbot.db
            state/cache
            out
          key: quizbot-state-${{ github.run_id }}
      - name: ledger — back up to the `ledger` branch (survives cache eviction)
        if: always() && steps.fmt.outputs.format != 'none'
        run: |
          [ -s state/quizbot.db ] || exit 0
          rm -rf /tmp/ledger && mkdir /tmp/ledger && cd /tmp/ledger && git init -q
          git config user.name "quizbot" && git config user.email "benjamincrystal8@gmail.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          git fetch -q origin ledger && git checkout -q -b ledger FETCH_HEAD || git checkout -q --orphan ledger
          cp "$GITHUB_WORKSPACE/state/quizbot.db" quizbot.db
          git add quizbot.db
          git diff --cached --quiet || git commit -q -m "ledger $(date -u +%FT%TZ)"
          git push -q origin ledger
      - name: post result to the "Episode log" issue
        if: always() && steps.fmt.outputs.format != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LINE=$(grep -E "🎬|📺|📱|⏸|❌|\[meta\]" state/run.log | tail -8 | sed 's/^/    /')
          BODY="[run ${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · ${{ steps.fmt.outputs.format }} · $(date -u +%FT%TZ)"$'\n'"$LINE"
          TITLE="Episode log"; [ "${{ steps.fmt.outputs.format }}" = "rapid" ] && TITLE="Rapid-fire log"
          N=$(gh issue list -R ${{ github.repository }} --search "$TITLE in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create -R ${{ github.repository }} --title "$TITLE" --body "$BODY"; else gh issue comment -R ${{ github.repository }} "$N" --body "$BODY"; fi
      - name: report failure to the "Run failures" issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### Run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed ($(date -u +%FT%TZ))\n\n\`\`\`\n$(tail -c 6000 state/run.log 2>/dev/null | sed 's/`/'"'"'/g')\n\`\`\`"
          N=$(gh issue list -R ${{ github.repository }} --search "Run failures in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create -R ${{ github.repository }} --title "Run failures" --body "$(printf '%b' "$BODY")"; else gh issue comment -R ${{ github.repository }} "$N" --body "$(printf '%b' "$BODY")"; fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.fmt.outputs.format != 'none'
        with:
          name: episode-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/thumbnail.jpg
            out/**/episode.json
            state/quizbot.log
          retention-days: 7
