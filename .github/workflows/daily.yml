# Zero-hardware alternative to launchd. Kokoro runs fine on the CPU runners.
# Secrets: YT_CLIENT_SECRET_JSON (config/client_secret.json), YT_TOKEN_JSON (state/youtube_token.json after a local
# `python -m quizbot auth`), ANTHROPIC_API_KEY if planner: claude, ELEVENLABS_API_KEY/OPENAI_API_KEY if used.
# The used-items DB persists in the Actions cache so Pokémon don't repeat.
name: episodes
on:
  schedule:
    - cron: "0 11 * * *"      # daily Short   — 07:00 New York (EDT; 06:00 in EST)
    - cron: "30 11 * * 6"     # weekly long   — Saturday 07:30 New York
  workflow_dispatch:
    inputs:
      format: { default: short, type: choice, options: [short, long] }
      theme: { default: "" }

jobs:
  episode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: pip install -r requirements.txt kokoro soundfile
      - uses: actions/cache@v4
        with:
          path: |
            state/quizbot.db
            state/cache
          key: quizbot-state-${{ github.run_id }}
          restore-keys: quizbot-state-
      - name: secrets → files
        run: |
          mkdir -p state config
          echo '${{ secrets.YT_CLIENT_SECRET_JSON }}' > config/client_secret.json
          echo '${{ secrets.YT_TOKEN_JSON }}' > state/youtube_token.json
      - name: decide format
        id: fmt
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "format=${{ github.event.inputs.format }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event.schedule }}" = "30 11 * * 6" ]; then echo "format=long" >> $GITHUB_OUTPUT
          else echo "format=short" >> $GITHUB_OUTPUT; fi
      - name: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # OpenAI voice when the key is present, Kokoro (free, local) otherwise
          QUIZBOT_TTS_PROVIDER: ${{ vars.QUIZBOT_TTS_PROVIDER || (secrets.OPENAI_API_KEY && 'openai' || 'kokoro') }}
          QUIZBOT_TTS_VOICE: ${{ vars.QUIZBOT_TTS_VOICE || (secrets.OPENAI_API_KEY && 'ash' || 'am_michael') }}
          QUIZBOT_PLANNER: ${{ vars.QUIZBOT_PLANNER || 'template' }}
          QUIZBOT_UPLOAD: "true"
          TZ: America/New_York
        run: |
          python -m quizbot retry-uploads || true
          python -m quizbot run --format ${{ steps.fmt.outputs.format }} \
            ${{ github.event.inputs.theme && format('--theme {0}', github.event.inputs.theme) || '' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: episode-${{ github.run_id }}
          path: |
            out/**/*.mp4
            out/**/thumbnail.jpg
            out/**/episode.json
            state/quizbot.log
          retention-days: 7
