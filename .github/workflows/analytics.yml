# Nightly: export channel/video analytics to JSON and push it to the `quizbot-data` branch of the portfolio repo
# (bencrystal.com/quizbot reads it from there at request time; main stays clean).
# Needs secret PORTFOLIO_TOKEN: a fine-grained GitHub token with Contents: read/write on bencrystal/portfolio_website.
name: analytics
on:
  workflow_dispatch:
  schedule:
    - cron: "40 6 * * *"      # 02:40 New York, after the day's YouTube Analytics has settled
permissions:
  issues: write
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: state/youtube_token.json
          key: yt-token-
          restore-keys: yt-token-
      - uses: actions/cache/restore@v4        # the episode ledger (read-only here)
        with:
          path: |
            state/quizbot.db
            state/cache
            out
          key: quizbot-state-
          restore-keys: quizbot-state-
      - run: |
          mkdir -p state config
          echo '${{ secrets.YT_CLIENT_SECRET_JSON }}' > config/client_secret.json
          [ -s state/youtube_token.json ] || echo '${{ secrets.YT_TOKEN_JSON }}' > state/youtube_token.json
      - run: python scripts/analytics_export.py out/quizbot-analytics.json 2>&1 | tee state/run.log
        shell: bash -o pipefail {0}
      - uses: actions/upload-artifact@v4
        with: { name: quizbot-analytics, path: out/quizbot-analytics.json, retention-days: 30 }
      - name: record experiment decisions in the repo
        run: |
          git config user.name "quizbot" && git config user.email "benjamincrystal8@gmail.com"
          git add state/experiments.json
          git diff --cached --quiet || (git commit -q -m "experiments: $(python -c "import json;d=json.load(open('state/experiments.json'));print('decided', d.get('decided'))")" && git push)
      - name: publish to the portfolio repo's quizbot-data branch (never main)
        env:
          PORTFOLIO_TOKEN: ${{ secrets.PORTFOLIO_TOKEN }}
        run: |
          if [ -z "$PORTFOLIO_TOKEN" ]; then echo "::warning::PORTFOLIO_TOKEN not set; JSON is in the run artifact only"; exit 0; fi
          REMOTE="https://x-access-token:${PORTFOLIO_TOKEN}@github.com/bencrystal/portfolio_website"
          mkdir site && cd site && git init -q
          git config user.name "quizbot" && git config user.email "benjamincrystal8@gmail.com"
          # keep the branch's own history (a snapshot per night); main is untouched
          git fetch -q "$REMOTE" quizbot-data && git checkout -q -b quizbot-data FETCH_HEAD || git checkout -q --orphan quizbot-data
          cp ../out/quizbot-analytics.json data.json
          git add data.json
          git diff --cached --quiet || git commit -q -m "quizbot analytics $(date -u +%F)"
          git push -q "$REMOTE" quizbot-data
      - name: report failure to the "Run failures" issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="### Run [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) failed ($(date -u +%FT%TZ))\n\n\`\`\`\n$(tail -c 6000 state/run.log 2>/dev/null | sed 's/`/'"'"'/g')\n\`\`\`"
          N=$(gh issue list -R ${{ github.repository }} --search "Run failures in:title" --state open --json number --jq '.[0].number')
          if [ -z "$N" ]; then gh issue create -R ${{ github.repository }} --title "Run failures" --body "$(printf '%b' "$BODY")"; else gh issue comment -R ${{ github.repository }} "$N" --body "$(printf '%b' "$BODY")"; fi
